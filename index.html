<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151618" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('markdown-diff-theme'); } catch {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#ffffff' : '#151618';
      })();
    </script>
    <meta name="description" content="Compare Markdown files side by side, with precise highlights in rendered tables, lists, and source. Files stay in your browser." />
    <title>Markdown Diff</title>
  </head>
  <body>
    <div class="app">
      <div id="comparison-chrome">
        <header class="toolbar">
          <a class="brand" href="%BASE_URL%" aria-label="Markdown Diff home" title="Markdown Diff home"><span class="brand-mark" aria-hidden="true">M<span>↔</span></span><span class="brand-label">Markdown Diff</span></a>
        <div class="tools">
          <div class="view-switch" role="group" aria-label="Comparison view" hidden>
            <button id="rendered-view" class="icon-button" type="button" aria-label="Rendered Markdown" title="Rendered Markdown" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span class="view-label">Rendered</span></button>
            <button id="source-view" class="icon-button" type="button" aria-label="Markdown source" title="Markdown source" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></svg><span class="view-label">Source</span></button>
          </div>
          <button id="swap" class="quiet icon-button" type="button" aria-label="Swap files" title="Swap files" disabled hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 7h18m-4-4 4 4-4 4M21 17H3m4-4-4 4 4 4"/></svg></button>
          <button id="clear" class="quiet icon-button" type="button" aria-label="Clear files" title="Clear files" disabled hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
          <button id="theme-toggle" class="quiet icon-button" type="button" aria-label="Switch color theme" title="Switch color theme">
            <svg class="theme-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
            <svg class="theme-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.8 14.2A9 9 0 0 1 9.8 3.2a9 9 0 1 0 11 11Z"/></svg>
          </button>
        </div>
        </header>
        <div class="comparison-head" hidden>
          <div class="file-bar" data-side="before"><details class="file-name" id="before-name"><summary tabindex="-1" aria-disabled="true">No file selected</summary></details><button class="file-browse quiet icon-button" data-side="before" type="button" aria-label="Choose original file" title="Choose original file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg></button><input id="before-input" type="file" multiple hidden></div>
          <div class="comparison-summary"><span id="status" role="status" aria-live="polite"></span><span id="stats"></span></div>
          <div class="file-bar" data-side="after"><details class="file-name" id="after-name"><summary tabindex="-1" aria-disabled="true">No file selected</summary></details><button class="file-browse quiet icon-button" data-side="after" type="button" aria-label="Choose changed file" title="Choose changed file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg></button><input id="after-input" type="file" multiple hidden></div>
        </div>
      </div>
      <main id="main">
        <div id="notice" class="notice" hidden role="alert"></div>
        <section id="empty" aria-label="Select Markdown files">
          <div class="empty-intro"><h1>Compare Markdown files</h1><p>Drop one file to compare it with an empty side, or two files together.</p></div>
          <div class="drop-grid">
            <div class="drop-target" data-side="before" tabindex="0" role="button" aria-label="Choose or drop the original Markdown file"><span class="file-icon" aria-hidden="true">↓</span><h2>Original</h2><span class="browse-label">Browse files</span></div>
            <div class="drop-target" data-side="after" tabindex="0" role="button" aria-label="Choose or drop the changed Markdown file"><span class="file-icon" aria-hidden="true">↓</span><h2>Changed</h2><span class="browse-label">Browse files</span></div>
          </div>
          <div class="empty-help"><a id="example" class="text-button" href="%BASE_URL%example/">Try an example <span aria-hidden="true">→</span></a></div>
        </section>
        <section id="comparison" aria-label="Markdown comparison" tabindex="-1" hidden></section>
      </main>
      <footer><span title="Files are never uploaded. Remote Markdown images load directly from their URLs.">Files stay in your browser</span></footer>
    </div>
    <div id="drop-overlay" hidden>Drop Markdown files to compare</div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
