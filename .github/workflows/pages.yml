name: Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run test:vscode
      - name: Repeat Rendered row and page restoration on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright test --config playwright.vscode.config.mjs --grep 'nonzero rendered page survives|rendered row bookmark beyond the initial batch' --repeat-each=20
      - run: |
          npm run package:vscode
          sha256sum artifacts/markdown-diff-vscode-*.vsix
      - name: Keep the VS Code installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: markdown-diff-vscode-${{ github.sha }}
          path: artifacts/markdown-diff-vscode-*.vsix
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  release-extension:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: markdown-diff-vscode-${{ github.sha }}
          path: artifacts
      - name: Publish a new extension version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r '.version' vscode/package.json)
          tag="vscode-v${version}"
          if published=$(gh release view "$tag" --json isDraft --jq '.isDraft | not' 2>/dev/null); then
            if [ "$published" = true ]; then
              echo "${tag} is already published; bump vscode/package.json to release an update."
              exit 0
            fi
            echo "::error::${tag} exists as a draft; finish or remove it before retrying."
            exit 1
          fi
          cp "artifacts/markdown-diff-vscode-${version}.vsix" artifacts/markdown-diff-vscode.vsix
          (cd artifacts && sha256sum markdown-diff-vscode.vsix > SHA256SUMS)
          gh release create "$tag" artifacts/markdown-diff-vscode.vsix artifacts/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Markdown Diff for VS Code ${version}" --latest \
            --notes "Download markdown-diff-vscode.vsix, then run Extensions: Install from VSIX in VS Code. Requires desktop VS Code 1.85 or newer. To update, install the new VSIX and reload the window. [Usage and limits](https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/vscode/README.md)." \
            --generate-notes

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
